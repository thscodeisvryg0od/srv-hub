<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRV // Core Hub</title>
<meta name="theme-color" content="#0b0d10">
<style>
:root {
  --bg: #0b0d10;
  --surface: #12151a;
  --card: #181c24;
  --border: #2a303c;
  --accent: #22d3a0;
  --accent-glow: rgba(34,211,160,0.35);
  --text: #f1f5f9;
  --muted: #94a3b8;
  --danger: #f87171;
  --font: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
body.light {
  --bg: #f8fafc;
  --surface: #ffffff;
  --card: #f1f5f9;
  --border: #e2e8f0;
  --accent: #0d9488;
  --accent-glow: rgba(13,148,136,0.25);
  --text: #0f172a;
  --muted: #64748b;
  --danger: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  padding-bottom: 60px;
  transition: background 0.3s, color 0.3s;
}
body.modal-open { overflow: hidden; }
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: 
    linear-gradient(rgba(34,211,160,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,160,0.03) 1px, transparent 1px);
  background-size: 42px 42px;
  pointer-events: none; z-index: -2;
}

/* NAV */
nav {
  background: rgba(11,13,16,0.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky; top: 0; z-index: 1000;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  color: var(--text); text-decoration: none;
  font-family: var(--font); font-weight: 700; font-size: 14px;
}
.logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #0f172a, #134e4a);
  border: 1px solid var(--accent);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 18px var(--accent-glow);
  animation: logoBreath 3.5s ease-in-out infinite;
}
@keyframes logoBreath {
  0%,100% { box-shadow: 0 0 12px var(--accent-glow); }
  50% { box-shadow: 0 0 24px rgba(34,211,160,0.55); }
}
.logo svg { width: 18px; height: 18px; fill: var(--accent); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.theme-btn {
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn svg { width: 16px; height: 16px; }
.menu-toggle {
  display: none; background: none; border: none; cursor: pointer;
  width: 28px; height: 22px; position: relative; z-index: 1001;
}
.menu-toggle span {
  display: block; position: absolute; height: 2px; width: 100%;
  background: var(--text); border-radius: 2px;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.menu-toggle span:nth-child(1) { top: 0; }
.menu-toggle span:nth-child(2) { top: 10px; }
.menu-toggle span:nth-child(3) { top: 20px; }
.menu-toggle.active span:nth-child(1) { transform: rotate(45deg); top: 10px; background: var(--accent); }
.menu-toggle.active span:nth-child(2) { opacity: 0; }
.menu-toggle.active span:nth-child(3) { transform: rotate(-45deg); top: 10px; background: var(--accent); }
.nav-links { list-style: none; display: flex; gap: 18px; align-items: center; }
.nav-links a { color: var(--muted); text-decoration: none; font-size: 13px; font-family: var(--font); }
.nav-links a:hover, .nav-links a.active { color: var(--accent); }

.container { max-width: 840px; margin: 0 auto; padding: 16px; }

/* DETAIL */
.detail-view { display: none; }
.detail-view.active { display: block; }
.detail-header {
  display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
}
.detail-back {
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
  font-family: var(--font); font-size: 12px; padding: 7px 14px; border-radius: 6px; cursor: pointer;
}
.detail-back:hover { border-color: var(--accent); color: var(--accent); }
.detail-title {
  font-family: var(--font); font-size: 22px; font-weight: 700; min-height: 32px;
}
.detail-title span { color: var(--accent); }
.detail-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; margin-bottom: 16px;
}
.detail-card h3 {
  font-family: var(--font); font-size: 13px; color: var(--accent); margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 0.6px;
}
.detail-meta {
  display: flex; flex-wrap: wrap; gap: 16px; margin: 14px 0 18px;
  font-family: var(--font); font-size: 13px; color: var(--muted);
}
.detail-meta strong { color: var(--accent); }
.verified-badge {
  display: inline-flex; align-items: center; gap: 5px;
  color: #60a5fa; font-weight: 600;
}
.verified-badge svg { width: 15px; height: 15px; fill: #60a5fa; }
.detail-gif {
  width: 100%; max-width: 280px; border-radius: 10px; margin: 12px 0 16px;
  border: 1px solid var(--border); display: block;
}
.detail-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.btn {
  background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 14px; font-family: var(--font); font-size: 12px; text-decoration: none;
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: 0.2s;
}
.btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary:hover { background: var(--accent); color: #0b0d10; border-color: var(--accent); }
.btn.primary:hover svg { fill: #0b0d10; stroke: #0b0d10; }
.btn.discord:hover { background: #5865f2; border-color: #5865f2; color: #fff; }
.btn.discord:hover svg { fill: #fff; }

/* FOOTER + LANG */
footer {
  margin-top: 48px; border-top: 1px solid var(--border); padding-top: 28px;
  text-align: center; font-family: var(--font);
}
.footer-links {
  display: flex; justify-content: center; gap: 18px; margin-bottom: 18px; flex-wrap: wrap;
}
.footer-links a {
  color: var(--muted); text-decoration: none; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
}
.footer-links a:hover { color: var(--accent); }
.lang-selector {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 12px; font-size: 12px; color: var(--muted); cursor: pointer;
  position: relative; user-select: none;
}
.lang-selector:hover { border-color: var(--accent); color: var(--text); }
.lang-selector svg { width: 14px; height: 14px; }
.lang-dropdown {
  position: absolute; bottom: calc(100% + 6px); right: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  min-width: 180px; padding: 6px 0; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35); z-index: 50;
}
.lang-selector.open .lang-dropdown { display: block; }
.lang-dropdown div {
  padding: 8px 14px; font-size: 13px; color: var(--text); cursor: pointer; text-align: left;
}
.lang-dropdown div:hover { background: rgba(34,211,160,0.08); color: var(--accent); }
.lang-dropdown div.active { color: var(--accent); }

.toast-wrap {
  position: fixed; bottom: 20px; right: 20px; z-index: 3000;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  font-family: var(--font); font-size: 12px; padding: 12px 16px; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25); opacity: 0; transform: translateY(10px); transition: 0.3s;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 680px) {
  .menu-toggle { display: block; }
  .nav-links {
    display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%;
    background: rgba(10,12,15,0.97); border-bottom: 1px solid var(--border);
    padding: 14px 18px; gap: 4px; transform: translateY(-10px); opacity: 0; pointer-events: none;
    transition: all 0.25s;
  }
  .nav-links.active { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .nav-links li { width: 100%; text-align: center; padding: 8px 0; border-bottom: 1px solid rgba(42,48,60,0.4); }
  .nav-links li:last-child { border-bottom: none; }
}
</style>
</head>

<nav>

<div class="container">

        <div>
          <div style="font-family:var(--font);font-size:18px;font-weight:700;" id="detailName">starzone.se</div>

      <div class="detail-meta" id="detailMeta"></div>

    <div class="detail-card">

        </svg>

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        <div class="lang-dropdown">
          <div class="active" data-lang="en" onclick="setLang('en', 'English', event)">English</div>
          <div data-lang="tr" onclick="setLang('tr', 'Türkçe', event)">Türkçe</div>
          <div data-lang="pt" onclick="setLang('pt', 'Português', event)">Português</div>
          <div data-lang="es" onclick="setLang('es', 'Español', event)">Español</div>
          <div data-lang="ja" onclick="setLang('ja', '日本語', event)">日本語</div>
          <div data-lang="ko" onclick="setLang('ko', '한국어', event)">한국어</div>
          <div data-lang="fr" onclick="setLang('fr', 'Français', event)">Français</div>
          <div data-lang="de" onclick="setLang('de', 'Deutsch', event)">Deutsch</div>

  </footer>
</div>

<div class="toast-wrap" id="toasts"></div>

    verified: "인증됨"
  },
  fr: {
    about: "À PROPOS",

    back: "← retour",
    visit: "./visiter_site",

    status: "Statut",

    uptime: "Uptime",

  },
  de: {
    about: "ÜBER",
    legal: "RECHTLICHES / COPYRIGHT",
    back: "← zurück",
    visit: "./seite_besuchen",
    discord: "./discord",
    status: "Status",

    uptime: "Uptime",

let currentLang = localStorage.getItem("srv_lang") || "en";

// StarZone data
const starzone = {
  id: "starzone",
  name: "starzone.se",
  avatar: "SZ",
  status: "online",
  verified: true,
  ping: 12,
  uptime: 99.9,

  discord: "https://discord.com/invite/starzone-12-glitchworld-750806110184669213",
  about: {
    en: "StarZone is a private server dedicated to the classic space combat experience of DarkOrbit. Built by the community, for the community — focusing on fair gameplay, active events and long-term stability.",
    tr: "StarZone, DarkOrbit'in klasik uzay savaş deneyimine adanmış özel bir sunucudur. Topluluk tarafından, topluluk için inşa edilmiştir — adil oynanış, aktif etkinlikler ve uzun vadeli istikrar odaklıdır.",

    es: "StarZone es un proyecto de fans independiente y sin fines de lucro. DarkOrbit es una marca registrada de Bigpoint GmbH. Todos los derechos pertenecen a sus respectivos propietarios.",

    de: "StarZone ist ein unabhängiges, gemeinnütziges Fan-Projekt. DarkOrbit ist eine eingetragene Marke der Bigpoint GmbH."

// ========== FUNCTIONS ==========
function toast(msg) {
  const w = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => t.classList.add("show"), 10);
  setTimeout(() => {
    t.classList.remove("show");
    setTimeout(() => t.remove(), 300);
  }, 2500);
}

function toggleTheme() {
  document.body.classList.toggle("light");
  localStorage.setItem("srv_theme", document.body.classList.contains("light") ? "light" : "dark");
}

function toggleMenu() {
  document.getElementById("menuToggle").classList.toggle("active");
  document.getElementById("navLinks").classList.toggle("active");
}
function closeMenu() {
  document.getElementById("menuToggle").classList.remove("active");
  document.getElementById("navLinks").classList.remove("active");
}

function toggleLang() {
  document.getElementById("langSelector").classList.toggle("open");
}

function setLang(lang, label, e) {
  e.stopPropagation();
  currentLang = lang;
  localStorage.setItem("srv_lang", lang);
  document.getElementById("currentLang").textContent = label;
  document.querySelectorAll(".lang-dropdown div").forEach(d => d.classList.remove("active"));
  e.target.classList.add("active");
  document.getElementById("langSelector").classList.remove("open");
  applyTranslations();
  renderDetail();
  toast("Language → " + label);
}

function applyTranslations() {
  const t = i18n[currentLang] || i18n.en;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (t[key]) el.textContent = t[key];
  });
}

document.addEventListener("click", function(e) {
  const sel = document.getElementById("langSelector");
  if (sel && !sel.contains(e.target)) sel.classList.remove("open");
});

// Typing effect
function typeText(element, text, speed = 45) {
  element.innerHTML = "";
  let i = 0;
  function tick() {
    if (i <= text.length) {
      const current = text.slice(0, i);
      element.innerHTML = current.endsWith("se") ? 
        "./<span>starzone.se</span>" : 
        (current.startsWith("./") ? current : "./" + current);
      i++;
      setTimeout(tick, speed);
    }
  }
  tick();
}

function renderDetail() {
  const t = i18n[currentLang] || i18n.en;
  const node = starzone;

  // Title with typing
  const titleEl = document.getElementById("detailTitle");
  typeText(titleEl, "starzone.se");

  document.getElementById("detailAvatar").textContent = node.avatar;
  document.getElementById("detailName").textContent = node.name;
  document.getElementById("detailCat").textContent = node.category;

  // Meta with official verified badge
  let meta = `
    <div>\( {t.status}: <strong style="color:var(--accent)"> \){node.status}</strong></div>

      ${t.verified}
    </div>
  `;
  document.getElementById("detailMeta").innerHTML = meta;

  // GIF
  const gif = document.getElementById("detailGif");
  gif.style.display = "block";
  gif.src = "spaceship.gif";

  // About & Legal
  document.getElementById("detailAbout").textContent = node.about[currentLang] || node.about.en;
  document.getElementById("detailLegal").textContent = node.legal[currentLang] || node.legal.en;

  // Buttons with icons
  document.getElementById("detailActions").innerHTML = `
    <a href="${node.site}" target="_blank" class="btn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
      ${t.visit}
    </a>
    <a href="${node.discord}" target="_blank" class="btn discord">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
